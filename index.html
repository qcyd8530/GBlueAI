<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 0秒后自动跳转，把下面的网址替换成你要跳转的目标地址 -->
    <meta http-equiv="refresh" content="0; url=https://qcyd8530.github.io/GBlue.html">
    <title>跳转中...</title>
    <style>
        /* 隐藏所有页面内容，实现无UI效果 */
        * {
            margin: 0;
            padding: 0;
            opacity: 0;
        }
    </style>
</head>
<body>
    <!-- 备用跳转：JS跳转，双重保障 -->
    <script>
        window.location.replace("https://qcyd8530.github.io/GBlue.html");
    </script>
    <!-- 降级方案：如果自动跳转失败，可手动点击这个链接（默认完全隐藏不显示） -->
    <a href="https://www.example.com" style="display:none;">正在跳转，请点击这里</a>
</body>
</html>
